<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f6fa;
        }

        header {
            background: #4f46e5;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 25px auto;
        }

        #search {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            margin-bottom: 20px;
        }

        #loading,
        #error {
            text-align: center;
            padding: 20px;
            font-size: 18px;
        }

        #error {
            color: red;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 3px 10px #ddd;
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: contain;
        }

        .card h3 {
            font-size: 17px;
        }

        .price {
            color: #4f46e5;
            font-size: 20px;
            font-weight: bold;
        }

        button {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <header>
        <h1>Mini Store</h1>
        <p>Online Product Store</p>
    </header>

    <div class="container">

        <input
            type="text"
            id="search"
            placeholder="Search products..."
        >

        <div id="loading">Loading products...</div>

        <div id="error"></div>

        <div class="products" id="productList"></div>

    </div>

    <script src="Task.js"></script>

</body>
</html>

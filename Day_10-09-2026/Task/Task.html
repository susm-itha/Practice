<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Management</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
        }

        header {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 30px auto;
        }

        .box {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        input, button {
            padding: 10px;
            margin: 5px;
        }

        input {
            width: 200px;
        }

        button {
            border: none;
            background: #222;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .product {
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 8px;
        }

        .in-stock {
            color: green;
            font-weight: bold;
        }

        .out-stock {
            color: red;
            font-weight: bold;
        }

        #message {
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <h1>🛒 Store Management</h1>
    <p>Store App</p>
</header>

<div class="container">

    <!-- Store Information -->
    <div class="box">
        <h2>Store Dashboard</h2>

        <p>Total Products: <span id="totalProducts">0</span></p>
        <p>Store User: <span id="storeUser">Guest</span></p>

        <button id="clearStorage">Clear Storage</button>
    </div>


    <!-- Add Product -->
    <div class="box">

        <h2>Add Product</h2>

        <input type="text" id="productName" placeholder="Product Name">

        <input type="number" id="productPrice" placeholder="Price">

        <input type="number" id="productStock" placeholder="Stock">

        <button id="addProduct">Add Product</button>

        <p id="message"></p>

    </div>


    <!-- Search -->
    <div class="box">

        <h2>Search Products</h2>

        <input
            type="text"
            id="search"
            placeholder="Search product..."
        >

    </div>


    <!-- Product List -->
    <div class="box">

        <h2>Products</h2>

        <div id="productList" class="products"></div>

    </div>

</div>

<script src="Task.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Super Market</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
        }

        header {
            background: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 25px auto;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        input,
        select {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            flex: 1;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .product {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .product img {
            width: 100%;
            height: 180px;
            object-fit: contain;
        }

        .product h3 {
            margin: 10px 0;
        }

        .price {
            color: green;
            font-size: 18px;
            font-weight: bold;
            margin: 8px 0;
        }

        button {
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            background: #27ae60;
            color: white;
        }

        button:hover {
            background: #219150;
        }

        .cart-section {
            background: white;
            margin-top: 30px;
            padding: 20px;
            border-radius: 10px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
            padding: 12px 0;
            gap: 10px;
        }

        .cart-buttons button {
            margin: 2px;
            padding: 6px 10px;
        }

        .total {
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
        }

        .clear-btn {
            background: #e74c3c;
            margin-top: 15px;
        }

        .loading {
            text-align: center;
            font-size: 20px;
            padding: 30px;
        }

        .error {
            color: red;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>🛒 Super Market</h1>
        <p>Super Market Management System</p>
    </header>

    <div class="container">

        <div class="controls">

            <input
                type="text"
                id="searchInput"
                placeholder="Search products..."
            >

            <select id="categoryFilter">
                <option value="all">All Categories</option>
            </select>

        </div>

        <div id="productContainer" class="products">
            <div class="loading">
                Loading products...
            </div>
        </div>

        <div class="cart-section">

            <h2>🛍️ Shopping Cart</h2>

            <div id="cartContainer">
                <p>Cart is empty</p>
            </div>

            <div class="total">
                Total: ₹<span id="totalPrice">0</span>
            </div>

            <button id="clearCart" class="clear-btn">
                Clear Cart
            </button>

        </div>

    </div>

    <script src="Assignment.js"></script>

</body>
</html>

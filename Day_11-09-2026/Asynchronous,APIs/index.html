<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Art Gallery </title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
        }

        .navbar {
            background: #4b2e83;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 25px auto;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 3px 10px #ddd;
        }

        .stat-card h2 {
            color: #4b2e83;
            margin-bottom: 8px;
        }

        .form-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 3px 10px #ddd;
        }

        .form-box h2 {
            margin-bottom: 15px;
        }

        input {
            padding: 12px;
            margin: 5px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #4b2e83;
            color: white;
            margin: 5px;
        }

        button:hover {
            opacity: 0.85;
        }

        .painting-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .painting-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px #ddd;
        }

        .painting-card h3 {
            color: #4b2e83;
            margin-bottom: 10px;
        }

        .painting-card p {
            margin: 7px 0;
        }

        .delete {
            background: #d32f2f;
        }

        .update {
            background: #1976d2;
        }

        .patch {
            background: #388e3c;
        }

        #loading {
            text-align: center;
            font-size: 20px;
            color: #4b2e83;
            margin: 20px;
        }

        #error {
            text-align: center;
            color: red;
            margin: 15px;
        }

        .tools {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-top: 25px;
        }

        @media(max-width: 700px) {
            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="navbar">
        <h1>Art Gallery </h1>
        <p>Painting Management System</p>
    </div>

    <div class="container">

        <!-- Statistics -->
        <div class="stats">

            <div class="stat-card">
                <h2 id="totalPaintings">0</h2>
                <p>Total Paintings</p>
            </div>

            <div class="stat-card">
                <h2 id="availablePaintings">0</h2>
                <p>Available</p>
            </div>

            <div class="stat-card">
                <h2 id="averagePrice">₹0</h2>
                <p>Average Price</p>
            </div>

        </div>


        <!-- Add Painting -->
        <div class="form-box">

            <h2>➕ Add New Painting</h2>

            <input
                type="text"
                id="paintingTitle"
                placeholder="Painting name"
            >

            <input
                type="text"
                id="artistName"
                placeholder="Artist name"
            >

            <input
                type="number"
                id="paintingPrice"
                placeholder="Price"
            >

            <button id="addBtn">
                Add Painting
            </button>

        </div>


        <!-- Loading -->
        <div id="loading">
            Loading paintings...
        </div>

        <!-- Error -->
        <div id="error"></div>


        <!-- Painting Cards -->
        <div
            id="paintingContainer"
            class="painting-container">
        </div>


        <!-- Promise / JavaScript Concepts -->
        <div class="tools">

            <h2>JavaScript API Practice</h2>

            <button id="promiseBtn">
                Promise Examples
            </button>

            <button id="callbackBtn">
                Callback Example
            </button>

            <button id="generatorBtn">
                Generator Example
            </button>

            <p id="result"></p>

        </div>

    </div>

    <script type="module" src="script.js"></script>

</body>
</html>

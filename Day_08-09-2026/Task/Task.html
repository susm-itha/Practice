<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
            background: #f5f7fb;
        }

        .app {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 220px;
            background: #222;
            color: white;
            padding: 25px 15px;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 35px;
        }

        .menu {
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
        }

        .menu:hover {
            background: #444;
        }

        /* Main */
        .main {
            flex: 1;
            padding: 25px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header button {
            padding: 10px 18px;
            border: none;
            background: #222;
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }

        /* Cards */
        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin: 25px 0;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px #ddd;
        }

        .card h3 {
            color: #777;
        }

        /* Table */
        .table-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th,
        td {
            padding: 14px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #f1f1f1;
        }

        .pass {
            color: green;
            font-weight: bold;
        }

        .fail {
            color: red;
            font-weight: bold;
        }

        .badge {
            background: #eee;
            padding: 5px 10px;
            border-radius: 15px;
        }
    </style>
</head>

<body>

    <div class="app">

        <!-- Sidebar -->
        <div class="sidebar">

            <h2>🎓 Student App</h2>

            <div class="menu">Dashboard</div>
            <div class="menu">Students</div>
            <div class="menu">Results</div>
            <div class="menu">Settings</div>

        </div>


        <!-- Main -->
        <div class="main">

            <div class="header">

                <div>
                    <h1>Dashboard</h1>
                    <p>Welcome to Student Management</p>
                </div>

                <button id="addStudentBtn">
                    + Add Student
                </button>

            </div>


            <!-- Dashboard Cards -->
            <div class="cards">

                <div class="card">
                    <h3>Total Students</h3>
                    <h1 id="total">0</h1>
                </div>

                <div class="card">
                    <h3>Passed</h3>
                    <h1 id="passed">0</h1>
                </div>

                <div class="card">
                    <h3>Failed</h3>
                    <h1 id="failed">0</h1>
                </div>

            </div>


            <!-- Student Table -->
            <div class="table-box">

                <h2>Student Details</h2>

                <table>

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Student</th>
                            <th>Marks</th>
                            <th>Grade</th>
                            <th>Status</th>
                        </tr>
                    </thead>

                    <tbody id="studentTable">
                    </tbody>

                </table>

            </div>

        </div>

    </div>

    <script src="Task.js"></script>

</body>

</html>
